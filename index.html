<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>Armari Lluc</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;color:#111}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f6f6f8,#eef0f5);min-height:100vh}
.app{max-width:520px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(88px + env(safe-area-inset-bottom))}
header{padding:24px 4px 12px}h1{font-size:34px;letter-spacing:-1.3px;margin:0 0 4px;font-weight:750}.sub{color:#777;font-size:15px}
.tabs{display:flex;gap:8px;overflow:auto;padding:8px 0 14px}.pill{border:0;border-radius:999px;padding:10px 15px;background:#ffffffb0;box-shadow:0 1px 5px #0000000b;color:#666;font-size:14px;white-space:nowrap}.pill.active{background:#111;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#ffffffc7;border:1px solid #fff;border-radius:22px;padding:10px;box-shadow:0 8px 25px #0000000a;overflow:hidden}.photo{height:190px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain}.name{font-weight:650;margin:10px 3px 2px;font-size:15px}.meta{margin:0 3px;color:#777;font-size:12px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#ffffffd5;backdrop-filter:blur(22px);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid #ffffff}
.nav{border:0;background:none;padding:8px;color:#777;font-size:12px}.nav.active{color:#111;font-weight:650}.icon{font-size:20px;display:block;margin-bottom:2px}
.panel{background:#ffffffb8;backdrop-filter:blur(20px);border:1px solid #fff;border-radius:26px;padding:14px;box-shadow:0 10px 30px #0000000a}
.segment{display:flex;background:#e5e5ea;border-radius:13px;padding:3px;margin-bottom:14px}.seg{flex:1;border:0;background:transparent;padding:9px;border-radius:10px;font-weight:600;color:#666}.seg.active{background:#fff;color:#111;box-shadow:0 1px 4px #0002}
.slot{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid #ddd}.slot:last-child{border-bottom:0}.slot b{font-size:14px}.select{border:0;background:#f0f0f4;border-radius:12px;padding:9px 10px;max-width:65%;font-size:13px}
.mannequin{height:430px;border-radius:22px;background:linear-gradient(#f9f9fb,#ededf2);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;margin-bottom:12px}.body{width:120px;height:300px;background:linear-gradient(#d9d9de,#bfc0c7);border-radius:55px 55px 35px 35px;position:relative;opacity:.72}.head{width:62px;height:62px;background:#c8c9ce;border-radius:50%;position:absolute;top:-72px;left:29px}.legs{position:absolute;bottom:-100px;left:26px;width:68px;height:120px;border-left:25px solid #bfc0c7;border-right:25px solid #bfc0c7}
.actions{display:flex;gap:8px;margin-top:12px}.primary,.secondary{flex:1;border:0;border-radius:15px;padding:13px;font-weight:650}.primary{background:#111;color:#fff}.secondary{background:#e5e5ea;color:#111}.empty{text-align:center;color:#777;padding:60px 20px}
</style>
</head>
<body><div class="app" id="app"></div>
<script>
const items=[{"id": "01", "cat": "Sabates", "brand": "New Balance", "color": "Blanc / gris / navy", "img": "Armari_Lluc_Imatges/Sabates/01_SABATES_New_Balance_blanc_gris_navy.png"}, {"id": "02", "cat": "Sabates", "brand": "Nike Dunk", "color": "Negre / gris", "img": "Armari_Lluc_Imatges/Sabates/02_SABATES_Nike_Dunk_negres_grisos.png"}, {"id": "03", "cat": "Sabates", "brand": "Nike Dunk", "color": "Blanc / gris", "img": "Armari_Lluc_Imatges/Sabates/03_SABATES_Nike_Dunk_blancs.png"}, {"id": "04", "cat": "Sabates", "brand": "Veja", "color": "Negre", "img": "Armari_Lluc_Imatges/Sabates/04_SABATES_Veja_negres.png"}, {"id": "05", "cat": "Sabates", "brand": "Air Force 1", "color": "Blanc", "img": "Armari_Lluc_Imatges/Sabates/05_SABATES_Air_Force_1_blancs.png"}, {"id": "06", "cat": "Sabates", "brand": "Air Force 1", "color": "Marró", "img": "Armari_Lluc_Imatges/Sabates/06_SABATES_Air_Force_1_marrons.png"}, {"id": "07", "cat": "Pantalons", "brand": "Dockers", "color": "Texà clar", "img": "Armari_Lluc_Imatges/Pantalons/07_PANTALO_Dockers_texa_clar.png"}, {"id": "08", "cat": "Pantalons", "brand": "Versace", "color": "Texà fosc", "img": "Armari_Lluc_Imatges/Pantalons/08_PANTALO_Versace_texa_fosc.png"}, {"id": "09", "cat": "Pantalons", "brand": "GAP", "color": "Gris", "img": "Armari_Lluc_Imatges/Pantalons/09_PANTALO_GAP_gris.png"}, {"id": "10", "cat": "Pantalons", "brand": "GAP", "color": "Pana marró", "img": "Armari_Lluc_Imatges/Pantalons/10_PANTALO_GAP_pana_marron.png"}, {"id": "11", "cat": "Pantalons", "brand": "Springfield", "color": "Gris molt clar", "img": "Armari_Lluc_Imatges/Pantalons/11_PANTALO_Springfield_xino_gris_molt_clar.png"}, {"id": "12", "cat": "Pantalons", "brand": "Jack & Jones", "color": "Verd sage", "img": "Armari_Lluc_Imatges/Pantalons/12_PANTALO_Jack_Jones_xino_verd_sage.png"}, {"id": "13", "cat": "Pantalons", "brand": "Jack & Jones", "color": "Negre", "img": "Armari_Lluc_Imatges/Pantalons/13_PANTALO_Jack_Jones_xino_negre.png"}, {"id": "14", "cat": "Pantalons", "brand": "Dockers", "color": "Negre", "img": "Armari_Lluc_Imatges/Pantalons/14_PANTALO_Dockers_xino_negre.png"}, {"id": "15", "cat": "Pantalons", "brand": "Dockers", "color": "Blau marí", "img": "Armari_Lluc_Imatges/Pantalons/15_PANTALO_Dockers_xino_blau_marine.png"}, {"id": "16", "cat": "Pantalons", "brand": "Dockers", "color": "Beix", "img": "Armari_Lluc_Imatges/Pantalons/16_PANTALO_Dockers_xino_beix.png"}, {"id": "17", "cat": "Pantalons", "brand": "Sense marca", "color": "Crema", "img": "Armari_Lluc_Imatges/Pantalons/17_PANTALO_xino_crema_sense_marca.png"}, {"id": "18", "cat": "Pantalons", "brand": "Jack & Jones", "color": "Blau fosc, recte", "img": "Armari_Lluc_Imatges/Pantalons/18_PANTALO_JJ_jeans_blau_fosc_recte.png"}, {"id": "19", "cat": "Pantalons", "brand": "New Look", "color": "Gris clar, recte", "img": "Armari_Lluc_Imatges/Pantalons/19_PANTALO_New_Look_jeans_gris_clar_recte.png"}, {"id": "20", "cat": "Jerseis", "brand": "Springfield", "color": "Gris clar", "img": "Armari_Lluc_Imatges/Jerseis/20_FULLZIP_Springfield_gris_clar.png"}, {"id": "21", "cat": "Jerseis", "brand": "Yachting", "color": "Blau marí fosc", "img": "Armari_Lluc_Imatges/Jerseis/21_FULLZIP_Yachting_blau_marí_fosc.png"}, {"id": "22", "cat": "Jerseis", "brand": "Bugatti", "color": "Blau marí", "img": "Armari_Lluc_Imatges/Jerseis/22_FULLZIP_Bugatti_blau_marí.png"}, {"id": "23", "cat": "Jerseis", "brand": "Toni Vartrano", "color": "Blanc trencat", "img": "Armari_Lluc_Imatges/Jerseis/23_JERSEI_Toni_Vartrano_blanc_trencat.png"}, {"id": "24", "cat": "Jerseis", "brand": "Mango", "color": "Gris clar", "img": "Armari_Lluc_Imatges/Jerseis/24_JERSEI_Mango_gris_clar.png"}, {"id": "25", "cat": "Jerseis", "brand": "Toni Vartrano", "color": "Verd sage clar", "img": "Armari_Lluc_Imatges/Jerseis/25_JERSEI_Toni_Vartrano_verd_sage_clar.png"}, {"id": "26", "cat": "Jerseis", "brand": "Lacoste", "color": "Gris, coll pic", "img": "Armari_Lluc_Imatges/Jerseis/26_JERSEI_Lacoste_gris_coll_pico.png"}, {"id": "27", "cat": "Jerseis", "brand": "Pull & Bear", "color": "Blau marí", "img": "Armari_Lluc_Imatges/Jerseis/27_JERSEI_Pull_and_Bear_azul_marino.png"}, {"id": "28", "cat": "Jerseis", "brand": "Salsa Jeans", "color": "Verd fosc", "img": "Armari_Lluc_Imatges/Jerseis/28_JERSEI_Salsa_Jeans_verd_fosc.png"}, {"id": "29", "cat": "Jerseis", "brand": "Zara", "color": "Gris oversized", "img": "Armari_Lluc_Imatges/Jerseis/29_SUDADERA_Zara_gris_oversized_estampat.png"}, {"id": "30", "cat": "Jerseis", "brand": "Ralph Lauren", "color": "Groc / blanc", "img": "Armari_Lluc_Imatges/Jerseis/30_JERSEI_Ralph_Lauren_groc_blanc.png"}, {"id": "31", "cat": "Jerseis", "brand": "Tommy Hilfiger", "color": "Blau", "img": "Armari_Lluc_Imatges/Jerseis/31_JERSEI_Tommy_Hilfiger_blau.png"}, {"id": "32", "cat": "Jerseis", "brand": "New Look", "color": "Negre", "img": "Armari_Lluc_Imatges/Jerseis/32_JERSEI_New_Look_negre.png"}, {"id": "33", "cat": "Jerseis", "brand": "Zara", "color": "Blau marí, coll blanc", "img": "Armari_Lluc_Imatges/Jerseis/33_SUDADERA_Zara_blau_coll_polo_blanc.png"}, {"id": "34", "cat": "Jerseis", "brand": "Ralph Lauren", "color": "Gris clar", "img": "Armari_Lluc_Imatges/Jerseis/34_HALFZIP_Ralph_Lauren_gris_clar.png"}, {"id": "35", "cat": "Jerseis", "brand": "Ralph Lauren", "color": "Blau marí", "img": "Armari_Lluc_Imatges/Jerseis/35_HALFZIP_Ralph_Lauren_blau_marino.png"}, {"id": "36", "cat": "Jerseis", "brand": "Jack & Jones", "color": "Blau", "img": "Armari_Lluc_Imatges/Jerseis/36_HALFZIP_Jack_and_Jones_blau.png"}, {"id": "37", "cat": "Jerseis", "brand": "Zara", "color": "Verd oliva", "img": "Armari_Lluc_Imatges/Jerseis/37_HALFZIP_Zara_verd_oliva.png"}, {"id": "38", "cat": "Jaquetes", "brand": "Lacoste", "color": "Blau marí", "img": "Armari_Lluc_Imatges/Jaquetes/38_JAQUETA_Lacoste_puffer_blau_marí.png"}, {"id": "39", "cat": "Jaquetes", "brand": "Napapijri", "color": "Negre", "img": "Armari_Lluc_Imatges/Jaquetes/39_JAQUETA_Napapijri_puffer_negra.png"}, {"id": "40", "cat": "Jaquetes", "brand": "Pull & Bear", "color": "Texana blau clar", "img": "Armari_Lluc_Imatges/Jaquetes/40_JAQUETA_Pull_and_Bear_texana_blau_clar.png"}, {"id": "41", "cat": "Jaquetes", "brand": "Pull & Bear", "color": "Americana negra", "img": "Armari_Lluc_Imatges/Jaquetes/41_JAQUETA_Pull_and_Bear_americana_negre.png"}, {"id": "42", "cat": "Jaquetes", "brand": "Zara", "color": "Blanc trencat", "img": "Armari_Lluc_Imatges/Jaquetes/42_JAQUETA_Zara_chaleco_puffer_blanc_trencat.png"}];
let screen="armari",category="Totes",mode="sense";
let selections={Sabates:null,Pantalons:null,Jerseis:null,Jaquetes:null};
let outfits=JSON.parse(localStorage.getItem("armari_lluc_outfits")||"[]");
function esc(s){return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function render(){
 const app=document.getElementById("app");
 app.innerHTML=`<header><h1>${screen==="armari"?"Armari":screen==="maniqui"?"Maniquí":"Outfits"}</h1><div class="sub">${screen==="armari"?"42 peces · el teu armari digital":screen==="maniqui"?"Construeix el teu look":"Looks guardats"}</div></header>`+
 (screen==="armari"?renderArmari():screen==="maniqui"?renderManiqui():renderOutfits())+
 `<nav class="bottom"><button class="nav ${screen==="armari"?"active":""}" onclick="go('armari')"><span class="icon">⌂</span>Armari</button><button class="nav ${screen==="maniqui"?"active":""}" onclick="go('maniqui')"><span class="icon">◯</span>Maniquí</button><button class="nav ${screen==="outfits"?"active":""}" onclick="go('outfits')"><span class="icon">☆</span>Outfits</button></nav>`;
}
function renderArmari(){
 const cats=["Totes","Sabates","Pantalons","Jerseis","Jaquetes"];
 const shown=category==="Totes"?items:items.filter(x=>x.cat===category);
 return `<div class="tabs">${cats.map(c=>`<button class="pill ${c===category?"active":""}" onclick="category='${c}';render()">${c}</button>`).join("")}</div>
 <div class="grid">${shown.map(x=>`<article class="card"><div class="photo"><img loading="lazy" src="${encodeURI(x.img)}" alt=""></div><div class="name">${esc(x.brand)}</div><div class="meta">${esc(x.color)}</div></article>`).join("")}</div>`;
}
function option(cat){
 const list=items.filter(x=>x.cat===cat);
 return `<select class="select" onchange="selections['${cat}']=this.value||null;render()"><option value="">Selecciona</option>${list.map(x=>`<option value="${x.id}" ${selections[cat]===x.id?"selected":""}>${esc(x.brand)} · ${esc(x.color)}</option>`).join("")}</select>`;
}
function renderManiqui(){
 const cats=mode==="sense"?["Sabates","Pantalons","Jerseis"]:["Sabates","Pantalons","Jerseis","Jaquetes"];
 return `<div class="panel"><div class="segment"><button class="seg ${mode==="sense"?"active":""}" onclick="mode='sense';selections.Jaquetes=null;render()">Sense jaqueta</button><button class="seg ${mode==="amb"?"active":""}" onclick="mode='amb';render()">Amb jaqueta</button></div>
 <div class="mannequin"><div class="body"><div class="head"></div><div class="legs"></div></div></div>
 ${cats.map(c=>`<div class="slot"><b>${c}</b>${option(c)}</div>`).join("")}
 <div class="actions"><button class="secondary" onclick="clearLook()">Netejar</button><button class="primary" onclick="saveOutfit()">Guardar outfit</button></div></div>`;
}
function saveOutfit(){
 if(!selections.Sabates||!selections.Pantalons||!selections.Jerseis){alert("Selecciona sabates, pantalons i jersei.");return}
 outfits.unshift({id:Date.now(),mode,items:{...selections},name:`Look ${outfits.length+1}`});
 localStorage.setItem("armari_lluc_outfits",JSON.stringify(outfits));go("outfits");
}
function clearLook(){selections={Sabates:null,Pantalons:null,Jerseis:null,Jaquetes:null};render()}
function renderOutfits(){
 if(!outfits.length)return `<div class="empty">Encara no tens cap outfit guardat.<br><br>Ves a <b>Maniquí</b> i crea el primer look.</div>`;
 return `<div class="grid">${outfits.map(o=>{const ids=Object.values(o.items).filter(Boolean);const its=ids.map(id=>items.find(x=>x.id===id)).filter(Boolean);return `<article class="card"><div class="photo">${its.slice(0,4).map(x=>`<img src="${encodeURI(x.img)}" style="width:48%;height:48%;object-fit:contain" alt="">`).join("")}</div><div class="name">${esc(o.name)}</div><div class="meta">${o.mode==="amb"?"Amb jaqueta":"Sense jaqueta"}</div><button class="secondary" style="margin-top:9px;width:100%" onclick="deleteOutfit(${o.id})">Eliminar</button></article>`}).join("")}</div>`;
}
function deleteOutfit(id){outfits=outfits.filter(x=>x.id!==id);localStorage.setItem("armari_lluc_outfits",JSON.stringify(outfits));render()}
function go(s){screen=s;render()} render();
</script></body></html>
