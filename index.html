<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" id="themeColor">
<title>Armari Lluc</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;color:#111}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f6f6f8,#eef0f5);min-height:100vh;transition:background .25s,color .25s}
body.dark{color:#f5f5f7;background:linear-gradient(#111214,#1c1d21)}
body.dark .sub,body.dark .meta{color:#9b9ba1}
body.dark .card,body.dark .panel{background:#242529cc;border-color:#3a3b40;box-shadow:0 10px 30px #00000035}
body.dark .pill{background:#2c2d32;color:#bfc0c6}
body.dark .pill.active{background:#fff;color:#111}
body.dark .bottom{background:#1d1e22e8;border-top-color:#383940}
body.dark .nav{color:#999ba3}body.dark .nav.active{color:#fff}
body.dark .segment{background:#303137}body.dark .seg{color:#a8a9b0}body.dark .seg.active{background:#4a4b52;color:#fff}
body.dark .select,body.dark input,body.dark textarea{background:#303137;color:#fff;border-color:#42434a}
body.dark .secondary{background:#303137;color:#fff}
body.dark .settings-card{background:#242529cc;border-color:#3a3b40}
body.dark .form-label{color:#cfd0d5}
body.dark .file-drop{background:#303137;border-color:#484950;color:#cfd0d5}

.app{max-width:520px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(88px + env(safe-area-inset-bottom))}
header{padding:24px 4px 12px}h1{font-size:34px;letter-spacing:-1.3px;margin:0 0 4px;font-weight:750}.sub{color:#777;font-size:15px}
.tabs{display:flex;gap:8px;overflow:auto;padding:8px 0 14px}.pill{border:0;border-radius:999px;padding:10px 15px;background:#ffffffb0;box-shadow:0 1px 5px #0000000b;color:#666;font-size:14px;white-space:nowrap}.pill.active{background:#111;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#ffffffc7;border:1px solid #fff;border-radius:22px;padding:10px;box-shadow:0 8px 25px #0000000a;overflow:hidden}.photo{height:190px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain}.name{font-weight:650;margin:10px 3px 2px;font-size:15px}.meta{margin:0 3px;color:#777;font-size:12px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#ffffffd5;backdrop-filter:blur(22px);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-top:1px solid #ffffff}
.nav{border:0;background:none;padding:8px;color:#777;font-size:12px}.nav.active{color:#111;font-weight:650}.icon{font-size:20px;display:block;margin-bottom:2px}
.panel{background:#ffffffb8;backdrop-filter:blur(20px);border:1px solid #fff;border-radius:26px;padding:14px;box-shadow:0 10px 30px #0000000a}
.segment{display:flex;background:#e5e5ea;border-radius:13px;padding:3px;margin-bottom:14px}.seg{flex:1;border:0;background:transparent;padding:9px;border-radius:10px;font-weight:600;color:#666}.seg.active{background:#fff;color:#111;box-shadow:0 1px 4px #0002}
.slot{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid #ddd}.slot:last-child{border-bottom:0}.slot b{font-size:14px}.select{border:0;background:#f0f0f4;border-radius:12px;padding:9px 10px;max-width:65%;font-size:13px}
.mannequin{height:430px;border-radius:22px;background:linear-gradient(145deg,#f8f8fa,#ececf2);position:relative;overflow:hidden;margin-bottom:12px;padding:14px}
.mannequin-board{position:absolute;inset:14px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.05fr .95fr .48fr;gap:10px}
.look-card{position:relative;border-radius:18px;background:#ffffffc9;border:1px solid #fff;box-shadow:0 8px 22px #0000000a;overflow:hidden;display:flex;align-items:center;justify-content:center}
.look-card img{width:100%;height:100%;object-fit:contain;padding:5px}
.look-top-card{grid-column:1 / span 2;grid-row:1}
.look-pants-card{grid-column:1 / span 2;grid-row:2}
.look-shoes-card{grid-column:1 / span 2;grid-row:3}
.look-jacket-card{grid-column:2;grid-row:1;z-index:2}
.mannequin.amb .look-top-card{grid-column:1;grid-row:1}
.mannequin.amb .look-jacket-card{grid-column:2;grid-row:1}
.look-card.empty-slot{background:#ffffff55;border:1px dashed #cfd0d6;box-shadow:none}
.look-placeholder{font-size:11px;color:#999;text-align:center;padding:10px}
.look-label{position:absolute;left:10px;bottom:10px;padding:6px 9px;border-radius:999px;background:#ffffffd0;backdrop-filter:blur(12px);font-size:11px;color:#666;z-index:5}

.actions{display:flex;gap:8px;margin-top:12px}.primary,.secondary{flex:1;border:0;border-radius:15px;padding:13px;font-weight:650}.primary{background:#111;color:#fff}.secondary{background:#e5e5ea;color:#111}.empty{text-align:center;color:#777;padding:60px 20px}

.settings-card{background:#ffffffb8;backdrop-filter:blur(20px);border:1px solid #fff;border-radius:24px;padding:16px;box-shadow:0 10px 30px #0000000a;margin-bottom:12px}
.settings-title{font-size:17px;font-weight:700;margin:0 0 4px}.settings-sub{font-size:13px;color:#777;margin-bottom:14px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid #ddd}.setting-row:last-child{border-bottom:0}
.switch{width:52px;height:32px;border:0;border-radius:999px;background:#d8d8dd;padding:3px;cursor:pointer;position:relative;transition:.2s}.switch::after{content:"";display:block;width:26px;height:26px;background:#fff;border-radius:50%;box-shadow:0 1px 4px #0003;transition:.2s}.switch.on{background:#111}.switch.on::after{transform:translateX(20px)}
.form-grid{display:grid;gap:12px}.form-label{display:block;font-size:13px;font-weight:650;margin:2px 0 6px}.form-input,.form-select,.form-textarea{width:100%;border:0;border-radius:13px;background:#f0f0f4;padding:12px 13px;font:inherit;outline:none}.form-textarea{min-height:72px;resize:vertical}
.file-drop{display:flex;align-items:center;justify-content:center;text-align:center;min-height:120px;border:1.5px dashed #c8c8ce;border-radius:18px;background:#f7f7f9;color:#666;padding:14px;cursor:pointer;overflow:hidden}
.file-drop img{width:100%;height:150px;object-fit:contain}.form-button{width:100%;border:0;border-radius:15px;padding:13px;font-weight:700;background:#111;color:#fff;margin-top:4px}.form-note{font-size:11px;color:#777;line-height:1.4;margin-top:8px}
.section-title{font-size:15px;font-weight:750;margin:20px 2px 9px}.danger-button{width:100%;border:0;border-radius:15px;padding:12px;background:#eeeef2;color:#111;font-weight:650}
body.dark .danger-button{background:#303137;color:#fff}
</style>
</head>
<body><div class="app" id="app"></div>
<script>
const baseItems=[{"id": "01", "cat": "Sabates", "brand": "New Balance", "color": "Blanc / gris / navy", "img": "Armari_Lluc_Imatges/Sabates/01_SABATES_New_Balance_blanc_gris_navy.png"}, {"id": "02", "cat": "Sabates", "brand": "Nike Dunk", "color": "Negre / gris", "img": "Armari_Lluc_Imatges/Sabates/02_SABATES_Nike_Dunk_negres_grisos.png"}, {"id": "03", "cat": "Sabates", "brand": "Nike Dunk", "color": "Blanc / gris", "img": "Armari_Lluc_Imatges/Sabates/03_SABATES_Nike_Dunk_blancs.png"}, {"id": "04", "cat": "Sabates", "brand": "Veja", "color": "Negre", "img": "Armari_Lluc_Imatges/Sabates/04_SABATES_Veja_negres.png"}, {"id": "05", "cat": "Sabates", "brand": "Air Force 1", "color": "Blanc", "img": "Armari_Lluc_Imatges/Sabates/05_SABATES_Air_Force_1_blancs.png"}, {"id": "06", "cat": "Sabates", "brand": "Air Force 1", "color": "Marró", "img": "Armari_Lluc_Imatges/Sabates/06_SABATES_Air_Force_1_marrons.png"}, {"id": "07", "cat": "Pantalons", "brand": "Dockers", "color": "Texà clar", "img": "Armari_Lluc_Imatges/Pantalons/07_PANTALO_Dockers_texa_clar.png"}, {"id": "08", "cat": "Pantalons", "brand": "Versace", "color": "Texà fosc", "img": "Armari_Lluc_Imatges/Pantalons/08_PANTALO_Versace_texa_fosc.png"}, {"id": "09", "cat": "Pantalons", "brand": "GAP", "color": "Gris", "img": "Armari_Lluc_Imatges/Pantalons/09_PANTALO_GAP_gris.png"}, {"id": "10", "cat": "Pantalons", "brand": "GAP", "color": "Pana marró", "img": "Armari_Lluc_Imatges/Pantalons/10_PANTALO_GAP_pana_marron.png"}, {"id": "11", "cat": "Pantalons", "brand": "Springfield", "color": "Gris molt clar", "img": "Armari_Lluc_Imatges/Pantalons/11_PANTALO_Springfield_xino_gris_molt_clar.png"}, {"id": "12", "cat": "Pantalons", "brand": "Jack & Jones", "color": "Verd sage", "img": "Armari_Lluc_Imatges/Pantalons/12_PANTALO_Jack_Jones_xino_verd_sage.png"}, {"id": "13", "cat": "Pantalons", "brand": "Jack & Jones", "color": "Negre", "img": "Armari_Lluc_Imatges/Pantalons/13_PANTALO_Jack_Jones_xino_negre.png"}, {"id": "14", "cat": "Pantalons", "brand": "Dockers", "color": "Negre", "img": "Armari_Lluc_Imatges/Pantalons/14_PANTALO_Dockers_xino_negre.png"}, {"id": "15", "cat": "Pantalons", "brand": "Dockers", "color": "Blau marí", "img": "Armari_Lluc_Imatges/Pantalons/15_PANTALO_Dockers_xino_blau_marine.png"}, {"id": "16", "cat": "Pantalons", "brand": "Dockers", "color": "Beix", "img": "Armari_Lluc_Imatges/Pantalons/16_PANTALO_Dockers_xino_beix.png"}, {"id": "17", "cat": "Pantalons", "brand": "Sense marca", "color": "Crema", "img": "Armari_Lluc_Imatges/Pantalons/17_PANTALO_xino_crema_sense_marca.png"}, {"id": "18", "cat": "Pantalons", "brand": "Jack & Jones", "color": "Blau fosc, recte", "img": "Armari_Lluc_Imatges/Pantalons/18_PANTALO_JJ_jeans_blau_fosc_recte.png"}, {"id": "19", "cat": "Pantalons", "brand": "New Look", "color": "Gris clar, recte", "img": "Armari_Lluc_Imatges/Pantalons/19_PANTALO_New_Look_jeans_gris_clar_recte.png"}, {"id": "20", "cat": "Jerseis", "brand": "Springfield", "color": "Gris clar", "img": "Armari_Lluc_Imatges/Jerseis/20_FULLZIP_Springfield_gris_clar.png"}, {"id": "21", "cat": "Jerseis", "brand": "Yachting", "color": "Blau marí fosc", "img": "Armari_Lluc_Imatges/Jerseis/21_FULLZIP_Yachting_blau_marí_fosc.png"}, {"id": "22", "cat": "Jerseis", "brand": "Bugatti", "color": "Blau marí", "img": "Armari_Lluc_Imatges/Jerseis/22_FULLZIP_Bugatti_blau_marí.png"}, {"id": "23", "cat": "Jerseis", "brand": "Toni Vartrano", "color": "Blanc trencat", "img": "Armari_Lluc_Imatges/Jerseis/23_JERSEI_Toni_Vartrano_blanc_trencat.png"}, {"id": "24", "cat": "Jerseis", "brand": "Mango", "color": "Gris clar", "img": "Armari_Lluc_Imatges/Jerseis/24_JERSEI_Mango_gris_clar.png"}, {"id": "25", "cat": "Jerseis", "brand": "Toni Vartrano", "color": "Verd sage clar", "img": "Armari_Lluc_Imatges/Jerseis/25_JERSEI_Toni_Vartrano_verd_sage_clar.png"}, {"id": "26", "cat": "Jerseis", "brand": "Lacoste", "color": "Gris, coll pic", "img": "Armari_Lluc_Imatges/Jerseis/26_JERSEI_Lacoste_gris_coll_pico.png"}, {"id": "27", "cat": "Jerseis", "brand": "Pull & Bear", "color": "Blau marí", "img": "Armari_Lluc_Imatges/Jerseis/27_JERSEI_Pull_and_Bear_azul_marino.png"}, {"id": "28", "cat": "Jerseis", "brand": "Salsa Jeans", "color": "Verd fosc", "img": "Armari_Lluc_Imatges/Jerseis/28_JERSEI_Salsa_Jeans_verd_fosc.png"}, {"id": "29", "cat": "Jerseis", "brand": "Zara", "color": "Gris oversized", "img": "Armari_Lluc_Imatges/Jerseis/29_SUDADERA_Zara_gris_oversized_estampat.png"}, {"id": "30", "cat": "Jerseis", "brand": "Ralph Lauren", "color": "Groc / blanc", "img": "Armari_Lluc_Imatges/Jerseis/30_JERSEI_Ralph_Lauren_groc_blanc.png"}, {"id": "31", "cat": "Jerseis", "brand": "Tommy Hilfiger", "color": "Blau", "img": "Armari_Lluc_Imatges/Jerseis/31_JERSEI_Tommy_Hilfiger_blau.png"}, {"id": "32", "cat": "Jerseis", "brand": "New Look", "color": "Negre", "img": "Armari_Lluc_Imatges/Jerseis/32_JERSEI_New_Look_negre.png"}, {"id": "33", "cat": "Jerseis", "brand": "Zara", "color": "Blau marí, coll blanc", "img": "Armari_Lluc_Imatges/Jerseis/33_SUDADERA_Zara_blau_coll_polo_blanc.png"}, {"id": "34", "cat": "Jerseis", "brand": "Ralph Lauren", "color": "Gris clar", "img": "Armari_Lluc_Imatges/Jerseis/34_HALFZIP_Ralph_Lauren_gris_clar.png"}, {"id": "35", "cat": "Jerseis", "brand": "Ralph Lauren", "color": "Blau marí", "img": "Armari_Lluc_Imatges/Jerseis/35_HALFZIP_Ralph_Lauren_blau_marino.png"}, {"id": "36", "cat": "Jerseis", "brand": "Jack & Jones", "color": "Blau", "img": "Armari_Lluc_Imatges/Jerseis/36_HALFZIP_Jack_and_Jones_blau.png"}, {"id": "37", "cat": "Jerseis", "brand": "Zara", "color": "Verd oliva", "img": "Armari_Lluc_Imatges/Jerseis/37_HALFZIP_Zara_verd_oliva.png"}, {"id": "38", "cat": "Jaquetes", "brand": "Lacoste", "color": "Blau marí", "img": "Armari_Lluc_Imatges/Jaquetes/38_JAQUETA_Lacoste_puffer_blau_marí.png"}, {"id": "39", "cat": "Jaquetes", "brand": "Napapijri", "color": "Negre", "img": "Armari_Lluc_Imatges/Jaquetes/39_JAQUETA_Napapijri_puffer_negra.png"}, {"id": "40", "cat": "Jaquetes", "brand": "Pull & Bear", "color": "Texana blau clar", "img": "Armari_Lluc_Imatges/Jaquetes/40_JAQUETA_Pull_and_Bear_texana_blau_clar.png"}, {"id": "41", "cat": "Jaquetes", "brand": "Pull & Bear", "color": "Americana negra", "img": "Armari_Lluc_Imatges/Jaquetes/41_JAQUETA_Pull_and_Bear_americana_negre.png"}, {"id": "42", "cat": "Jaquetes", "brand": "Zara", "color": "Blanc trencat", "img": "Armari_Lluc_Imatges/Jaquetes/42_JAQUETA_Zara_chaleco_puffer_blanc_trencat.png"}];
let userItems=JSON.parse(localStorage.getItem("armari_lluc_user_items")||"[]");
let items=[...baseItems,...userItems];
let screen="armari",category="Totes",mode="sense";
let theme=localStorage.getItem("armari_lluc_theme")||"light";
document.body.classList.toggle("dark",theme==="dark");
document.getElementById("themeColor").setAttribute("content",theme==="dark"?"#111214":"#f2f2f7");

let selections={Sabates:null,Pantalons:null,Jerseis:null,Jaquetes:null};
let outfits=JSON.parse(localStorage.getItem("armari_lluc_outfits")||"[]");
function esc(s){return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function render(){
 const app=document.getElementById("app");
 app.innerHTML=`<header><h1>${screen==="armari"?"Armari":screen==="maniqui"?"Maniquí":screen==="outfits"?"Outfits":"Ajustos"}</h1><div class="sub">${screen==="armari"?items.length+" peces · el teu armari digital":screen==="maniqui"?"Construeix el teu look":screen==="outfits"?"Looks guardats":"Personalitza l'aplicació"}</div></header>`+
 (screen==="armari"?renderArmari():screen==="maniqui"?renderManiqui():screen==="outfits"?renderOutfits():renderSettings())+
 `<nav class="bottom"><button class="nav ${screen==="armari"?"active":""}" onclick="go('armari')"><span class="icon">⌂</span>Armari</button><button class="nav ${screen==="maniqui"?"active":""}" onclick="go('maniqui')"><span class="icon">◯</span>Maniquí</button><button class="nav ${screen==="outfits"?"active":""}" onclick="go('outfits')"><span class="icon">☆</span>Outfits</button><button class="nav ${screen==="ajustos"?"active":""}" onclick="go('ajustos')"><span class="icon">⚙</span>Ajustos</button></nav>`;
}
function renderArmari(){
 const cats=["Totes","Sabates","Pantalons","Jerseis","Jaquetes"];
 const shown=category==="Totes"?items:items.filter(x=>x.cat===category);
 return `<div class="tabs">${cats.map(c=>`<button class="pill ${c===category?"active":""}" onclick="category='${c}';render()">${c}</button>`).join("")}</div>
 <div class="grid">${shown.map(x=>`<article class="card"><div class="photo"><img loading="lazy" src="${encodeURI(x.img)}" alt=""></div><div class="name">${esc(x.brand)}</div><div class="meta">${esc(x.color)}</div></article>`).join("")}</div>`;
}
function option(cat){
 const list=items.filter(x=>x.cat===cat);
 return `<select class="select" onchange="selections['${cat}']=this.value||null;render()"><option value="">Selecciona</option>${list.map(x=>`<option value="${x.id}" ${selections[cat]===x.id?"selected":""}>${esc(x.brand)} · ${esc(x.color)}</option>`).join("")}</select>`;
}
function renderManiqui(){
 const cats=mode==="sense"?["Sabates","Pantalons","Jerseis"]:["Sabates","Pantalons","Jerseis","Jaquetes"];
 const selected=(cat)=>selections[cat]?items.find(x=>x.id===selections[cat]):null;
 const shoes=selected("Sabates"), pants=selected("Pantalons"), top=selected("Jerseis"), jacket=mode==="amb"?selected("Jaquetes"):null;
 const card=(x,cls,label)=>x
   ? `<div class="look-card ${cls}"><img src="${encodeURI(x.img)}" alt="${esc(x.brand)}"></div>`
   : `<div class="look-card ${cls} empty-slot"><div class="look-placeholder">${label}</div></div>`;
 return `<div class="panel"><div class="segment"><button class="seg ${mode==="sense"?"active":""}" onclick="mode='sense';selections.Jaquetes=null;render()">Sense jaqueta</button><button class="seg ${mode==="amb"?"active":""}" onclick="mode='amb';render()">Amb jaqueta</button></div>
 <div class="mannequin ${mode==="amb"?"amb":""}">
   <div class="mannequin-board">
     ${mode==="amb"
       ? `${card(top,"look-top-card","Tria un jersei")}${card(jacket,"look-jacket-card","Tria una jaqueta")}`
       : card(top,"look-top-card","Tria un jersei")}
     ${card(pants,"look-pants-card","Tria uns pantalons")}
     ${card(shoes,"look-shoes-card","Tria unes sabates")}
   </div>
   <div class="look-label">${mode==="amb"?"Look amb jaqueta":"Previsualització del look"}</div>
 </div>
 ${cats.map(c=>`<div class="slot"><b>${c}</b>${option(c)}</div>`).join("")}
 <div style="margin-top:12px">
   <input id="lookName" class="select" style="width:100%;max-width:none;padding:12px 13px;background:#f0f0f4" placeholder="Nom del look (ex. Casual divendres)" value="">
 </div>
 <div class="actions"><button class="secondary" onclick="clearLook()">Netejar</button><button class="primary" onclick="saveOutfit()">Guardar outfit</button></div></div>`;
}

function renderSettings(){
 return `<div>
   <div class="settings-card">
     <div class="settings-title">Aparença</div>
     <div class="settings-sub">Tria com vols veure l'aplicació.</div>
     <div class="setting-row"><div><b>Mode fosc</b><div class="settings-sub" style="margin:3px 0 0">Canvia entre clar i fosc</div></div><button class="switch ${theme==="dark"?"on":""}" aria-label="Mode fosc" onclick="toggleTheme()"></button></div>
   </div>
   <div class="settings-card">
     <div class="settings-title">Afegir peça</div>
     <div class="settings-sub">Afegeix una peça pròpia al teu armari.</div>
     <form class="form-grid" onsubmit="addPiece(event)">
       <div><label class="form-label">Imatge</label><label class="file-drop" id="fileDrop"><span>Prem per seleccionar una foto</span><input id="pieceImage" type="file" accept="image/*" hidden onchange="previewPiece(event)"></label></div>
       <div><label class="form-label">Categoria</label><select id="pieceCategory" class="form-select"><option>Sabates</option><option>Pantalons</option><option>Jerseis</option><option>Jaquetes</option></select></div>
       <div><label class="form-label">Marca</label><input id="pieceBrand" class="form-input" placeholder="Ex. Lacoste" required></div>
       <div><label class="form-label">Color / descripció</label><input id="pieceColor" class="form-input" placeholder="Ex. Blau marí" required></div>
       <div><label class="form-label">Notes <span style="font-weight:400;color:#888">(opcional)</span></label><textarea id="pieceNotes" class="form-textarea" placeholder="Model, material, tallatge..."></textarea></div>
       <button class="form-button" type="submit">Afegir al meu armari</button>
       <div class="form-note">La peça i la seva imatge es guarden en aquest dispositiu/navegador.</div>
     </form>
   </div>
   <div class="settings-card">
     <div class="settings-title">Dades</div>
     <div class="settings-sub">Peces pròpies afegides: ${userItems.length}</div>
     ${userItems.length?`<button class="danger-button" onclick="removeUserPieces()">Eliminar peces afegides</button>`:""}
   </div>
 </div>`;
}
function toggleTheme(){
 theme=theme==="dark"?"light":"dark";
 localStorage.setItem("armari_lluc_theme",theme);
 document.body.classList.toggle("dark",theme==="dark");
 document.getElementById("themeColor").setAttribute("content",theme==="dark"?"#111214":"#f2f2f7");
 render();
}
function previewPiece(e){
 const file=e.target.files&&e.target.files[0]; if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{document.getElementById("fileDrop").innerHTML=`<img src="${reader.result}" alt="Previsualització"><input id="pieceImage" type="file" accept="image/*" hidden onchange="previewPiece(event)">`; document.getElementById("fileDrop").dataset.src=reader.result;};
 reader.readAsDataURL(file);
}
function compressImage(dataUrl){
 return new Promise(resolve=>{
   const img=new Image();
   img.onload=()=>{
     const max=1000, scale=Math.min(1,max/Math.max(img.width,img.height));
     const c=document.createElement("canvas"); c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
     const ctx=c.getContext("2d"); ctx.drawImage(img,0,0,c.width,c.height);
     resolve(c.toDataURL("image/webp",0.82));
   };
   img.src=dataUrl;
 });
}
async function addPiece(e){
 e.preventDefault();
 const file=document.getElementById("pieceImage").files[0];
 const drop=document.getElementById("fileDrop");
 const dataUrl=drop.dataset.src;
 if(!file&&!dataUrl){alert("Afegeix una imatge.");return;}
 const raw=dataUrl||await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});
 const img=await compressImage(raw);
 const piece={id:"U"+Date.now(),cat:document.getElementById("pieceCategory").value,brand:document.getElementById("pieceBrand").value.trim(),color:document.getElementById("pieceColor").value.trim(),notes:document.getElementById("pieceNotes").value.trim(),img};
 userItems.unshift(piece); items=[...baseItems,...userItems];
 try{localStorage.setItem("armari_lluc_user_items",JSON.stringify(userItems));}catch(err){userItems.shift();items=[...baseItems,...userItems];alert("No hi ha prou espai per guardar aquesta imatge. Prova amb una foto més petita.");return;}
 alert("Peça afegida al teu armari.");
 render();
}
function removeUserPieces(){
 if(!confirm("Eliminar totes les peces que has afegit?"))return;
 userItems=[];items=[...baseItems];localStorage.removeItem("armari_lluc_user_items");render();
}
function saveOutfit(){
 if(!selections.Sabates||!selections.Pantalons||!selections.Jerseis){alert("Selecciona sabates, pantalons i jersei.");return}
 const input=document.getElementById("lookName");
 const typed=input?input.value.trim():"";
 const name=typed||`Look ${outfits.length+1}`;
 outfits.unshift({id:Date.now(),mode,items:{...selections},name});
 localStorage.setItem("armari_lluc_outfits",JSON.stringify(outfits));go("outfits");
}
function clearLook(){selections={Sabates:null,Pantalons:null,Jerseis:null,Jaquetes:null};render()}
function renderOutfits(){
 if(!outfits.length)return `<div class="empty">Encara no tens cap outfit guardat.<br><br>Ves a <b>Maniquí</b> i crea el primer look.</div>`;
 return `<div class="grid">${outfits.map(o=>{const ids=Object.values(o.items).filter(Boolean);const its=ids.map(id=>items.find(x=>x.id===id)).filter(Boolean);return `<article class="card"><div class="photo">${its.slice(0,4).map(x=>`<img src="${encodeURI(x.img)}" style="width:48%;height:48%;object-fit:contain" alt="">`).join("")}</div><div class="name">${esc(o.name)}</div><div class="meta">${o.mode==="amb"?"Amb jaqueta":"Sense jaqueta"}</div><div style="display:flex;gap:8px;margin-top:9px">
 <button class="secondary" style="flex:1" onclick="renameOutfit(${o.id})">Renombrar</button>
 <button class="secondary" style="flex:1" onclick="deleteOutfit(${o.id})">Eliminar</button>
</div></article>`}).join("")}</div>`;
}
function renameOutfit(id){
 const outfit=outfits.find(x=>x.id===id);
 if(!outfit)return;
 const name=prompt("Nom del look:",outfit.name||"");
 if(name===null)return;
 const trimmed=name.trim();
 if(!trimmed)return;
 outfit.name=trimmed;
 localStorage.setItem("armari_lluc_outfits",JSON.stringify(outfits));
 render();
}
function deleteOutfit(id){outfits=outfits.filter(x=>x.id!==id);localStorage.setItem("armari_lluc_outfits",JSON.stringify(outfits));render()}
function go(s){screen=s;render()} render();
</script></body></html>
