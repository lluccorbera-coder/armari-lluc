function option(cat){

 return `<select class="select" onchange="selections['${cat}']=this.value||null;render()"><option value="">Selecciona</option>${list.map(x=>`<option value="${x.id}" ${selections[cat]===x.id?"selected":""}>${esc(x.brand)} · ${esc(x.color)}</option>`).join("")}</select>`;
}

function colorGroup(x){
 const s=(x.color||"").toLowerCase();
 if(s.includes("negre"))return "black";
 if(s.includes("blanc")||s.includes("crema")||s.includes("trencat"))return "light";
 if(s.includes("gris"))return "grey";
 if(s.includes("navy")||s.includes("marí")||s.includes("blau"))return "blue";
 if(s.includes("verd")||s.includes("sage")||s.includes("oliva"))return "green";
 if(s.includes("marró")||s.includes("pana"))return "brown";
 if(s.includes("groc"))return "yellow";
 if(s.includes("texà"))return "denim";
 return "neutral";
}
function styleGroup(x){
 const id=String(x.id);
 if(["20","21","22","34","35","36","37"].includes(id))return "smartcasual";
 if(["29","33"].includes(id))return "casual";
 if(["38","39","42"].includes(id))return "outercasual";
 if(["40"].includes(id))return "denim";
 if(["41"].includes(id))return "smart";
 return "basic";
}

function pairKey(a,b){return [String(a.id),String(b.id)].sort((x,y)=>Number(x)-Number(y)).join("-")}
function compatibilityScore(a,b){
 if(!a||!b||a.cat===b.cat)return 0;
 const explicit=explicitCompat[pairKey(a,b)];
 if(explicit)return explicit;
 let score=(colorCompatibility[colorGroup(a)][colorGroup(b)]||3);
 const sa=styleGroup(a), sb=styleGroup(b);
 if((sa==="smart"&&sb==="casual")||(sa==="casual"&&sb==="smart"))score-=1;
 if((sa==="denim"&&sb==="smartcasual")||(sa==="smartcasual"&&sb==="denim"))score+=0;
 if(a.cat==="Sabates"&&b.cat==="Jerseis")score+=0.2;
 if(a.cat==="Jaquetes"&&b.cat==="Jerseis"&&sa==="outercasual")score+=0.2;
 return Math.max(1,Math.min(5,Math.round(score)));
}
function recommendationScore(candidate){
 const selected=Object.entries(selections)
   .filter(([cat,id])=>id && cat!==candidate.cat)
   .map(([cat,id])=>items.find(x=>x.id===id))
   .filter(Boolean);

 if(!selected.length)return 0;

 // A recommendation must work with the whole combination, not just one piece.
 // For a 2-piece base, the candidate completes a 3-piece look.
 // We penalize the weakest pair so one bad combination cannot be hidden
 // by several good ones.
 const pairScores=selected.map(x=>compatibilityScore(candidate,x));
 const avg=pairScores.reduce((a,b)=>a+b,0)/pairScores.length;
 const weakest=Math.min(...pairScores);
 return Math.max(1,Math.min(5,Math.round((avg*0.4+weakest*0.6)*10)/10));
}

function baseSelections(){
 return ["Sabates","Pantalons","Jerseis"]
   .map(cat=>selections[cat]?items.find(x=>x.id===selections[cat]):null)
   .filter(Boolean);
}

function recommendedFor(cat){
 const base=baseSelections();
 const hasShoes=!!selections.Sabates;
 const hasPants=!!selections.Pantalons;
 const hasTop=!!selections.Jerseis;
 const baseCount=base.length;

 // The recommendation flow is deliberately sequential:
 // 0 selected -> nothing
 // 1 base piece -> recommend the other 2 base categories
 // 2 base pieces -> recommend only the missing base category
 // 3 base pieces -> recommend jackets, but only in "Amb jaqueta".
 if(baseCount===0)return [];

 if(cat==="Jaquetes"){
   if(mode!=="amb" || baseCount!==3)return [];
 } else {
   if(baseCount===3)return [];
   if(baseCount===2){
     const missing= !hasShoes?"Sabates":!hasPants?"Pantalons":"Jerseis";
     if(cat!==missing)return [];
   } else if(baseCount===1){
     const selectedCat=hasShoes?"Sabates":hasPants?"Pantalons":"Jerseis";
     if(cat===selectedCat)return [];
   }
 }

 return items
   .filter(x=>x.cat===cat && x.id!==selections[cat])
   .map(x=>({x,score:recommendationScore(x)}))
   .sort((a,b)=>b.score-a.score||String(a.x.id).localeCompare(String(b.x.id),undefined,{numeric:true}))
   .slice(0,5);
}

function renderRecommendations(){
 const base=baseSelections();
 if(!base.length){
   return `<div class="recommendations"><div class="rec-header"><h3>Recomanacions</h3></div><div class="rec-empty">Selecciona una peça per començar.</div></div>`;
 }

 const possible=mode==="amb"
   ?["Sabates","Pantalons","Jerseis","Jaquetes"]
   :["Sabates","Pantalons","Jerseis"];

 const groups=possible.map(cat=>{
   const recs=recommendedFor(cat);
   if(!recs.length)return "";
   const title=cat==="Jaquetes"?"Jaquetes que completen el look":`${cat} que combinen`;
   return `<div class="rec-group"><div class="rec-group-title">${title}</div><div class="rec-scroll">${recs.map(({x,score})=>`
     <button class="rec-card" onclick="pickPiece('${cat}','${x.id}')">
       <img src="${encodeURI(x.img)}" alt="${esc(x.brand)}">
       <b>${esc(x.brand)}</b>
       <small>${esc(x.color)}</small>
       <div class="rec-score">${Math.round(score*20)}% compatibilitat</div>
     </button>`).join("")}</div></div>`;
 }).join("");

 if(!groups){
   const message=base.length===3
     ? (mode==="amb" ? "El look base està complet. Ara pots afegir una jaqueta." : "El look base està complet.")
     : "Selecciona una peça recomanada per continuar construint el look.";
   return `<div class="recommendations"><div class="rec-header"><h3>Recomanacions</h3></div><div class="rec-empty">${message}</div></div>`;
 }

 return `<div class="recommendations"><div class="rec-header"><h3>Recomanacions</h3><span>Per completar aquest look</span></div>${groups}</div>`;
}

}

   const id="custom_"+Date.now();

function previewPiece(e){
 const file=e.target.files&&e.target.files[0]; if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{document.getElementById("fileDrop").innerHTML=`<img src="${reader.result}" alt="Previsualització"><input id="pieceImage" type="file" accept="image/*" hidden onchange="previewPiece(event)">`; document.getElementById("fileDrop").dataset.src=reader.result;};
 reader.readAsDataURL(file);
}
function compressImage(dataUrl){
 return new Promise(resolve=>{
   const img=new Image();
   img.onload=()=>{
     const max=1000, scale=Math.min(1,max/Math.max(img.width,img.height));
     const c=document.createElement("canvas"); c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
     const ctx=c.getContext("2d"); ctx.drawImage(img,0,0,c.width,c.height);
     resolve(c.toDataURL("image/webp",0.82));
   };
   img.src=dataUrl;
 });
}
async function addPiece(e){
 e.preventDefault();
 const file=document.getElementById("pieceImage").files[0];
 const drop=document.getElementById("fileDrop");
 const dataUrl=drop.dataset.src;
 if(!file&&!dataUrl){alert("Afegeix una imatge.");return;}
 const raw=dataUrl||await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});
 const img=await compressImage(raw);
 const piece={id:"U"+Date.now(),cat:document.getElementById("pieceCategory").value,brand:document.getElementById("pieceBrand").value.trim(),color:document.getElementById("pieceColor").value.trim(),notes:document.getElementById("pieceNotes").value.trim(),img};
 userItems.unshift(piece); items=[...baseItems,...userItems];
 try{localStorage.setItem("armari_lluc_user_items",JSON.stringify(userItems));
 localStorage.setItem("armari_lluc_items_custom",JSON.stringify(userItems));}catch(err){userItems.shift();items=[...baseItems,...userItems];alert("No hi ha prou espai per guardar aquesta imatge. Prova amb una foto més petita.");return;}
 alert("Peça afegida al teu armari.");
 render();
}
